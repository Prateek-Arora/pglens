name: Idea or feature request
description: Something PgLens should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [docs/backlog.md](https://github.com/Prateek-Arora/pglens/blob/main/docs/backlog.md)
        first — several ideas are already thought through there, with why they wait.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
