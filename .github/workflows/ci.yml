name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint (shell, Dockerfile, SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install all three linters, then run the SAME scripts/lint.sh developers run
      # locally — one source of truth for the file lists, so CI and local never drift
      # (lint.sh skips a missing linter locally; here all three are installed and enforced).
      - name: Install linters (shellcheck, hadolint, sqlfluff)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          pip install --user sqlfluff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint (scripts/lint.sh)
        run: bash scripts/lint.sh

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the tip

      - name: Scan for secrets (scripts/secret_scan.sh)
        run: bash scripts/secret_scan.sh

  smoke:
    name: smoke test (compose end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: bash scripts/smoke_test.sh

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  build:
    name: build (java — spotless, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The Testcontainers integration tests boot the real monitored image
      # (pglens/monitored-db:0.0.0) — build it first so it is in the local Docker
      # cache before `check` runs `integrationTest`. The pgvector metadata image is
      # pulled from Docker Hub by Testcontainers automatically.
      - name: Build monitored image (for Testcontainers integration tests)
        run: docker build -t pglens/monitored-db:0.0.0 deploy/compose/monitored

      # Root `build` compiles every module (:proto, :engine, :cli, :agent, :server) and
      # runs Spotless + unit tests + the Testcontainers integration tests wired into
      # `check` — including the full agent→server→metadata flow IT in :server (Phase 2).
      - name: Gradle build (spotless + unit + integration, all modules)
        run: ./gradlew build --no-daemon --stacktrace

      # The Java images build from source inside Docker (ADR-0050): validate every target (server,
      # agent, cli — base, build stage, non-root) builds. No stack bring-up here (the e2e job does
      # that, and the flow IT above covers the loop deterministically).
      - name: Build the Java images (validate the Dockerfile)
        run: |
          for target in server agent cli; do
            docker build --target "$target" -t "pglens-ci/$target" -f deploy/compose/java/Dockerfile .
          done
          docker run --rm pglens-ci/cli --version

  dashboard:
    name: dashboard (format, lint, typecheck, unit, build, API-contract drift, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      # pnpm's release-age and trust-policy gates (pnpm-workspace.yaml) apply to this install.
      - name: Install (frozen lockfile)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # The types are generated from the committed spec (docs/api/openapi.json, which the server's
      # OpenApiSpecIntegrationTest keeps equal to what it serves): regenerate and fail on any diff.
      - name: API types match the committed spec
        run: |
          pnpm api:types
          git diff --exit-code -- src/lib/api/schema.d.ts

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Dependency audit (runtime dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: e2e (full stack + dashboard — Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dashboard dependencies + Chromium
        working-directory: dashboard
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --no-shell chromium

      # make up (every service, dashboard included) → seed → register → warmup → Playwright.
      - name: End-to-end smoke (scripts/e2e.sh)
        env:
          CI: "true"
        run: bash scripts/e2e.sh

      # No trace/report artifact: Playwright records typed values, including the admin password.

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  compat:
    name: compat (integration suite on PG ${{ matrix.pg }})
    # The main `build` job pins PG16 (ADR-0011). Real users run newer majors, and PG18 already broke
    # an assumption silently (it strips a leading comment from pg_stat_statements text — ADR-0036),
    # so the same engine + server integration suite also runs against each newer supported major.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build monitored image for PG ${{ matrix.pg }}
        run: >-
          docker build --build-arg PG_MAJOR=${{ matrix.pg }}
          -t pglens/monitored-db:pg${{ matrix.pg }} deploy/compose/monitored

      - name: Integration tests against PG ${{ matrix.pg }}
        run: >-
          ./gradlew :engine:integrationTest :server:integrationTest --no-daemon --stacktrace
          -PmonitoredImage=pglens/monitored-db:pg${{ matrix.pg }}
