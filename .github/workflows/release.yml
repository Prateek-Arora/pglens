name: release

# A pushed tag v<version> publishes that release (ADR-0050):
#   * multi-arch images (linux/amd64 + linux/arm64) to ghcr.io/<owner>/pglens-{server,agent,cli,
#     dashboard,demo-db}:<version>, which `docker compose up` and the dashboard's agent snippet pull;
#   * a DRAFT GitHub release (a pre-release for -rc/-beta tags) with the CLI jar and its checksum.
# Nothing is announced: the draft is published by hand (principle 5). New GHCR packages start
# private — make each public once in the package settings, or pulls need a login.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    name: versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          bash scripts/check_versions.sh "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.image }}
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            file: deploy/compose/java/Dockerfile
            target: server
          - image: agent
            context: .
            file: deploy/compose/java/Dockerfile
            target: agent
          - image: cli
            context: .
            file: deploy/compose/java/Dockerfile
            target: cli
          - image: dashboard
            context: dashboard
            file: dashboard/Dockerfile
            target: ""
          - image: demo-db
            context: deploy/compose/monitored
            file: deploy/compose/monitored/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pglens-${{ matrix.image }}:${{ needs.versions.outputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  draft:
    name: draft the GitHub release
    needs: [versions, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the CLI jar
        run: |
          ./gradlew --no-daemon :cli:bootJar
          mkdir dist
          cp "cli/build/libs/cli-${{ needs.versions.outputs.version }}.jar" "dist/pglens-cli-${{ needs.versions.outputs.version }}.jar"
          (cd dist && sha256sum ./*.jar > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.versions.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${{ needs.versions.outputs.version }}" >&2; exit 1; }
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "PgLens $GITHUB_REF_NAME" --notes-file notes.md dist/*
