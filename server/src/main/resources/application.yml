# PgLens server configuration.
#
# The datasource points at the METADATA database (Postgres + pgvector) — never a monitored DB. Flyway
# runs the migrations under db/migration on startup. Defaults match the Phase 0 compose stack
# (metadata-db on host port 5434); override via env for other environments.
spring:
  application:
    name: pglens-server
  datasource:
    url: ${PGLENS_METADATA_URL:jdbc:postgresql://localhost:5434/pglens_meta}
    username: ${PGLENS_METADATA_USER:pglens}
    password: ${PGLENS_METADATA_PASSWORD:pglens}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error bodies for framework errors too (bad JSON, 404, 405)

# The HTTP API's OpenAPI description (ADR-0044) — public, like the health check: it describes the
# API, it holds no data. No Swagger UI is shipped.
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  paths-to-match: /api/v1/**

# HTTP API (Phase 4, ADR-0044): /api/v1, stateless bearer tokens. The dashboard calls it from its own
# server code on the private network; scripts can use it with a read-only API token.
server:
  port: ${PGLENS_HTTP_PORT:8080}

pglens:
  version: 0.0.7   # reported by /api/v1/health and the OpenAPI description
  # Login for the HTTP API (ADR-0044). REQUIRED by default; `none` = one person on their own machine
  # (every response is flagged and the dashboard shows a banner). On an empty users table the server
  # creates the first admin: PGLENS_ADMIN_PASSWORD (12+ characters), or a generated password logged
  # once. A username gets `login-max-failures` wrong passwords per `login-lockout`.
  auth:
    mode: ${PGLENS_AUTH_MODE:required}
    session-idle-timeout: ${PGLENS_SESSION_IDLE_TIMEOUT:8h}
    session-max-age: ${PGLENS_SESSION_MAX_AGE:7d}
    admin-username: ${PGLENS_ADMIN_USERNAME:admin}
    admin-password: ${PGLENS_ADMIN_PASSWORD:}
    login-max-failures: 5
    login-lockout: 15m
  api:
    # A registered database whose agent sent nothing for this long shows as STALE (the agent may be
    # down). Several default sampling intervals (60 s), so one slow cycle doesn't flap it.
    agent-stale-after: ${PGLENS_AGENT_STALE_AFTER:5m}
  # gRPC listener for agents. TLS is ON by default (ADR-0044): the agent's bearer token rides every
  # call. Give a PEM certificate chain + unencrypted PKCS#8 key; the compose stack generates a dev CA.
  # PGLENS_GRPC_PLAINTEXT=true runs without TLS (trusted private network only; logged as a warning).
  grpc:
    port: ${PGLENS_GRPC_PORT:9090}
    plaintext: ${PGLENS_GRPC_PLAINTEXT:false}
    tls:
      cert: ${PGLENS_GRPC_TLS_CERT:}
      key: ${PGLENS_GRPC_TLS_KEY:}
  # Scheduled analysis job (ADR-0028): singleton across replicas via a transaction-scoped advisory
  # lock. Enqueues HypoPG-validation work for the agent edge to run.
  analysis:
    interval-ms: ${PGLENS_ANALYSIS_INTERVAL_MS:30000}
    initial-delay-ms: ${PGLENS_ANALYSIS_INITIAL_DELAY_MS:15000}
    # Don't re-validate a candidate whose recommendation is younger than this (F1) — bounds redundant
    # edge HypoPG re-runs while still refreshing a stale verdict once it ages out (default 1h).
    revalidate-after-ms: ${PGLENS_ANALYSIS_REVALIDATE_AFTER_MS:3600000}
    # Prune terminal (DONE/FAILED) validation jobs older than this (F1); the verdict lives on in
    # `recommendations`, so this only bounds the work-queue's audit trail (default 7 days).
    job-retention-ms: ${PGLENS_ANALYSIS_JOB_RETENTION_MS:604800000}
  # Plain-language explanations (Phase 3, ADR-0043). OFF by default: when enabled, a separate
  # scheduled pass explains each db's top indexes with an OpenAI-compatible LLM and caches the result
  # (table `explanations`) for the Phase-4 dashboard. It also embeds the bundled PostgreSQL-docs
  # passages into pgvector (`knowledge_chunks`) once per corpus version + embedding model.
  explain:
    enabled: ${PGLENS_EXPLAIN_ENABLED:false}
    interval-ms: ${PGLENS_EXPLAIN_INTERVAL_MS:300000}
    initial-delay-ms: ${PGLENS_EXPLAIN_INITIAL_DELAY_MS:60000}
    top-n: ${PGLENS_EXPLAIN_TOP_N:5}
    max-per-pass: ${PGLENS_EXPLAIN_MAX_PER_PASS:5}
    # A template written because the model was unreachable is regenerated after this long.
    retry-after-ms: ${PGLENS_EXPLAIN_RETRY_AFTER_MS:3600000}
    # Retrieved docs go into the prompt only if the pre-registered eval says they help
    # (docs/llm-eval.md §1.6); otherwise they only add "further reading" links.
    docs-in-prompt: ${PGLENS_EXPLAIN_DOCS_IN_PROMPT:false}
  llm:
    base-url: ${PGLENS_LLM_URL:http://localhost:11434/v1}
    model: ${PGLENS_LLM_MODEL:qwen3.5:4b}
    embedding-model: ${PGLENS_LLM_EMBEDDING_MODEL:nomic-embed-text}
    api-key: ${PGLENS_LLM_API_KEY:}
    timeout-seconds: ${PGLENS_LLM_TIMEOUT_SECONDS:120}
    reasoning-effort: ${PGLENS_LLM_REASONING_EFFORT:none}
    # Endpoints outside this machine/private network are refused unless this is true: prompts carry
    # normalized query text and table/column names.
    allow-remote: ${PGLENS_LLM_ALLOW_REMOTE:false}
