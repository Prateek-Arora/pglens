# PgLens: its own store (metadata-db), the server and the dashboard — plus, in the `demo` profile, a
# deliberately slow demo database (monitored-db) and the agent that watches it.
#
#   make up                                   everything, built from source, demo included
#   make up-no-demo                           PgLens only, for your own databases (ADR-0053)
#   docker compose up -d                      PgLens only, pulling the released images
#   docker compose --profile demo up -d       … with the demo
#
# Released images: ghcr.io/prateek-arora/pglens-*, version PGLENS_VERSION; compose builds any it
# can't pull (ADR-0050). Ports sit off the defaults so a local Postgres on 5432 doesn't clash.

services:
  monitored-db:
    profiles: ["demo"]
    build:
      context: ./monitored
    image: ghcr.io/prateek-arora/pglens-demo-db:${PGLENS_VERSION:-0.1.0-rc}
    # pg_stat_statements MUST be loaded via a preload library at server start;
    # setting it with ALTER SYSTEM after boot would not load it. Bake it in here.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pglens}
      POSTGRES_DB: ${MONITORED_DB:-pglens_demo}
    # This machine only: the demo's superuser password is a well-known default (ADR-0050).
    ports:
      - "127.0.0.1:${MONITORED_PORT:-5433}:5432"
    volumes:
      - monitored-pgdata:/var/lib/postgresql/data
      # Runs once, on a fresh data volume: registers extensions + creates schema.
      - ./monitored/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Force TCP so the check only passes once the REAL server is up — during
      # initdb the bootstrap server listens on the unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-pglens} -d ${MONITORED_DB:-pglens_demo}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  metadata-db:
    # Pinned exact version (not the rolling :pg16 tag) for reproducibility;
    # >= 0.8.2 also carries the CVE-2026-3172 fix.
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pglens}
      POSTGRES_DB: ${METADATA_DB:-pglens_meta}
    # This machine only: PgLens's own store holds every monitored database's query text and the
    # login and token hashes, and its superuser password is a default (ADR-0050).
    ports:
      - "127.0.0.1:${METADATA_PORT:-5434}:5432"
    volumes:
      - metadata-pgdata:/var/lib/postgresql/data
      - ./metadata/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-pglens} -d ${METADATA_DB:-pglens_meta}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # One-shot: dev TLS material for the agent <-> server gRPC channel (ADR-0044) into `grpc-certs`.
  # Reuses the metadata-db image (already pulled; ships openssl). Idempotent. Real deployments give the
  # server their own certificate instead (PGLENS_GRPC_TLS_CERT / PGLENS_GRPC_TLS_KEY).
  certs:
    image: pgvector/pgvector:0.8.6-pg16
    entrypoint: ["/bin/sh", "/gen-dev-certs.sh"]
    environment:
      # Extra names for the server certificate, e.g. an agent on another host: DNS:pglens.internal
      # (host.docker.internal is always included, for an agent container on this machine).
      PGLENS_TLS_EXTRA_SANS: ${PGLENS_TLS_EXTRA_SANS:-}
    volumes:
      - grpc-certs:/certs
      - ./certs/gen-dev-certs.sh:/gen-dev-certs.sh:ro
    restart: "no"

  # The PgLens server: gRPC ingest/validation + Flyway migrations + scheduled analysis. Talks to the
  # metadata-db by its service name on the INTERNAL port 5432 (not the host-mapped 5434). Built from
  # the repo root by deploy/compose/java/Dockerfile (Gradle runs inside the build — no JDK needed).
  server:
    build:
      context: ../..
      dockerfile: deploy/compose/java/Dockerfile
      target: server
    image: ghcr.io/prateek-arora/pglens-server:${PGLENS_VERSION:-0.1.0-rc}
    depends_on:
      metadata-db:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    volumes:
      # Only the server's own certificate + key (never the agent's view of the volume).
      - type: volume
        source: grpc-certs
        target: /certs
        read_only: true
        volume:
          subpath: server
    environment:
      PGLENS_METADATA_URL: jdbc:postgresql://metadata-db:5432/${METADATA_DB:-pglens_meta}
      PGLENS_METADATA_USER: ${POSTGRES_USER:-pglens}
      PGLENS_METADATA_PASSWORD: ${POSTGRES_PASSWORD:-pglens}
      PGLENS_GRPC_PORT: "9090"
      # gRPC TLS (ADR-0044): on by default with the dev certificate from the `certs` service.
      PGLENS_GRPC_TLS_CERT: /certs/server.pem
      PGLENS_GRPC_TLS_KEY: /certs/server.key
      # HTTP API login (ADR-0044). `make up` generates the password into deploy/compose/.env; unset
      # (plain `docker compose up`) → a generated one is logged once on first start
      # (`docker compose logs server`). AUTH_MODE=none: one person on their own machine only.
      PGLENS_ADMIN_PASSWORD: ${PGLENS_ADMIN_PASSWORD:-}
      PGLENS_AUTH_MODE: ${PGLENS_AUTH_MODE:-required}
      # Per-sample history kept this many days; the hourly rollup is kept (ADR-0053).
      PGLENS_RETENTION_RAW_DAYS: ${PGLENS_RETENTION_RAW_DAYS:-35}
      # Plain-language explanations (Phase 3, ADR-0043) — off unless PGLENS_EXPLAIN_ENABLED=true.
      # Default endpoint: the `llm` profile below. Native Ollama on the host instead:
      # PGLENS_LLM_URL=http://host.docker.internal:11434/v1
      PGLENS_EXPLAIN_ENABLED: ${PGLENS_EXPLAIN_ENABLED:-false}
      PGLENS_LLM_URL: ${PGLENS_LLM_URL:-http://llm:11434/v1}
      PGLENS_LLM_MODEL: ${PGLENS_LLM_MODEL:-qwen3.5:4b}
      # A hosted OpenAI-compatible API instead of a local model: set all three in your shell or a
      # git-ignored .env (never in this file). Remote hosts are refused unless ALLOW_REMOTE=true.
      PGLENS_LLM_API_KEY: ${PGLENS_LLM_API_KEY:-}
      PGLENS_LLM_ALLOW_REMOTE: ${PGLENS_LLM_ALLOW_REMOTE:-false}
      PGLENS_LLM_EMBEDDING_MODEL: ${PGLENS_LLM_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "${PGLENS_GRPC_PORT:-9090}:9090"
      # The HTTP API, on this machine only by default: the dashboard reaches it on the compose
      # network. Publish it wider only behind TLS (docs/operations.md §5).
      - "127.0.0.1:${PGLENS_HTTP_PORT:-8080}:8080"
    healthcheck:
      # TCP connects to both listeners (gRPC is TLS, so no plain probe). The JRE base image (Ubuntu)
      # ships bash, so /dev/tcp works.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9090' && timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # The collector agent: reads the monitored-db as the read-only pglens_ro role (ADR-0030) and
  # streams samples to the server. Headless daemon (no port). Its token comes from registering the
  # database through the API: `make register` after `make up` does that and writes the token into
  # deploy/compose/.env (until then the agent retries, logging UNAUTHENTICATED each cycle — non-fatal).
  agent:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: deploy/compose/java/Dockerfile
      target: agent
    image: ghcr.io/prateek-arora/pglens-agent:${PGLENS_VERSION:-0.1.0-rc}
    depends_on:
      monitored-db:
        condition: service_healthy
      server:
        condition: service_healthy
    volumes:
      # Only the dev CA certificate — the agent never sees the server's private key.
      - type: volume
        source: grpc-certs
        target: /certs
        read_only: true
        volume:
          subpath: ca
    environment:
      PGLENS_MONITORED_DB_URL: postgresql://pglens_ro:pglens_ro@monitored-db:5432/${MONITORED_DB:-pglens_demo}
      PGLENS_DB_NAME: ${PGLENS_DB_NAME:-demo}
      PGLENS_DB_HOST: monitored-db
      PGLENS_SERVER_HOST: server
      PGLENS_SERVER_PORT: "9090"
      PGLENS_SERVER_CA_CERT: /certs/ca.pem
      PGLENS_AGENT_TOKEN: ${PGLENS_AGENT_TOKEN:-}
      # A livelier cadence than the 60s default so the demo accumulates trend points quickly.
      PGLENS_SAMPLE_INTERVAL_MS: ${PGLENS_SAMPLE_INTERVAL_MS:-15000}

  # The web dashboard (Phase 4B, ADR-0046): Next.js, whose server code calls the API on the compose
  # network — the browser only ever talks to the dashboard. On this machine only by default: logins
  # over plain HTTP must not cross a network (put the README's HTTPS proxy in front to share it).
  dashboard:
    build:
      context: ../../dashboard
    image: ghcr.io/prateek-arora/pglens-dashboard:${PGLENS_VERSION:-0.1.0-rc}
    depends_on:
      server:
        condition: service_healthy
    environment:
      PGLENS_API_URL: http://server:8080
    ports:
      - "127.0.0.1:${PGLENS_DASHBOARD_PORT:-3000}:3000"
    # Nothing in the image needs to change at run time.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # Optional local LLM for plain-language explanations (Phase 3, ADR-0043): `make llm-up`.
  # Needs ~5 GB of free RAM. Docker on macOS has no GPU access, so this runs on the CPU (~15–30 s
  # per explanation); on a Mac, native Ollama (https://ollama.com) uses the GPU and is faster.
  llm:
    profiles: ["llm"]
    image: ollama/ollama:0.34.4
    ports:
      # This machine only: the model endpoint takes query text and has no login.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - llm-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  # One-shot: downloads the chat model (~3.4 GB) and the embedding model (~0.3 GB) into the volume.
  llm-pull:
    profiles: ["llm"]
    image: ollama/ollama:0.34.4
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: llm:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${PGLENS_LLM_MODEL:-qwen3.5:4b} && ollama pull nomic-embed-text"]
    restart: "no"

volumes:
  grpc-certs:
  monitored-pgdata:
  metadata-pgdata:
  llm-models:
