# Central, pinned dependency versions (reproducibility — a project value; see ADR-0011).
# Verified latest-stable on 2026-08-25; spring-boot moved 3.5 -> 4.1 on 2026-09-26 (ADR-0044: 3.5 left
# OSS support on 2026-06-30, and Phase 4 adds the server's first HTTP/login surface).

[versions]
springBoot = "4.1.1"
# OpenAPI for the HTTP API (ADR-0044); 3.1.x is built on Boot 4.1. API-only starter: no Swagger UI.
springdoc = "3.1.1"
dependencyManagement = "1.1.7"
picocli = "4.7.7"
postgresql = "42.7.13"
testcontainers = "2.0.5"
spotless = "8.10.0"
# Phase 2 (gRPC ingest). grpc-java + protobuf are pinned exactly; protoc must match protobuf-java
# so codegen and runtime agree (see :proto build). We use plain grpc-java (not Spring gRPC, whose
# maintained 1.0.x line requires Spring Boot 4.1 — incompatible with the pinned Boot 3.5; same call
# as ADR-0012's plain-picocli decision). Flyway is managed by the Spring Boot BOM (no version here).
grpc = "1.83.1"
protobuf = "4.31.1"
protobufPlugin = "0.9.5"
tomcatAnnotations = "6.0.53"

[libraries]
# Versionless entries get their version from a BOM applied via platform()/dependency-management.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

# gRPC / Protobuf (Phase 2). grpc-bom aligns all io.grpc artifacts to one version; protobuf-java is
# pinned to match the protoc used for codegen. tomcat annotations-api supplies javax.annotation
# for grpc-generated stubs on the JDK-21 toolchain (it isn't in the JDK).
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-testing = { module = "io.grpc:grpc-testing" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
tomcat-annotations-api = { module = "org.apache.tomcat:annotations-api", version.ref = "tomcatAnnotations" }

# DB migrations (Phase 2). Versionless: managed by the Spring Boot dependencies BOM. Since Flyway 10,
# the Postgres support lives in a separate flyway-database-postgresql artifact.
# Boot 4 split auto-configuration into per-technology modules: Flyway only runs with its starter.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Phase 4 (ADR-0044): the server's HTTP API. Boot 4 renamed starter-web to starter-webmvc.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
